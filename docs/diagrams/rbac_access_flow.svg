<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="ar-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <filter id="f-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A8A">DataShield-PDP: Role-Based Access Control (RBAC) &amp; Audit Trail</text>
  <text x="500" y="60" text-anchor="middle" font-size="12" fill="#64748B">Enforcing UU PDP Principles: Least Privilege, Pseudonymization &amp; Immutable Logging</text>

  <!-- User Query -->
  <rect x="40" y="160" width="190" height="90" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" filter="url(#f-shadow)"/>
  <text x="135" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Client Query Request</text>
  <text x="135" y="215" text-anchor="middle" font-size="11" fill="#475569">Notebook / BI Tool / API</text>
  <text x="135" y="235" text-anchor="middle" font-size="10" fill="#64748B">Carries User Identity &amp; Role</text>

  <!-- Auth Guard -->
  <polygon points="340,150 450,205 340,260 230,205" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" filter="url(#f-shadow)"/>
  <text x="340" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#1E40AF">RBAC Guard</text>
  <text x="340" y="218" text-anchor="middle" font-size="10" fill="#2563EB">Verify Permissions</text>

  <line x1="230" y1="205" x2="230" y2="205" stroke="#3B82F6" stroke-width="2"/>
  <line x1="230" y1="205" x2="230" y2="205" stroke="#3B82F6" stroke-width="2" marker-end="url(#ar-blue)"/>

  <!-- Path A: Data Analyst -->
  <rect x="520" y="100" width="200" height="75" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="620" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#065F46">Role: Data Analyst</text>
  <text x="620" y="148" text-anchor="middle" font-size="10" fill="#047857">Anonymized Mart Access Only</text>
  <text x="620" y="163" text-anchor="middle" font-size="10" font-weight="600" fill="#059669">✓ Non-Privileged Role</text>

  <rect x="760" y="95" width="200" height="85" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="860" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#064E3B">Masked Data Mart Response</text>
  <text x="775" y="140" font-size="10" fill="#065F46">• NIK: 320101********01</text>
  <text x="775" y="155" font-size="10" fill="#065F46">• Phone: 0812****7890</text>
  <text x="775" y="170" font-size="10" fill="#065F46">• Customer: HASH_e3b0c44...</text>

  <line x1="395" y1="178" x2="515" y2="135" stroke="#10B981" stroke-width="2" marker-end="url(#ar-green)"/>
  <text x="430" y="145" font-size="10" font-weight="700" fill="#059669">Analyst</text>
  <line x1="720" y1="137" x2="755" y2="137" stroke="#059669" stroke-width="2" marker-end="url(#ar-green)"/>

  <!-- Path B: DPO -->
  <rect x="520" y="240" width="200" height="75" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="620" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#991B1B">Role: Compliance Officer</text>
  <text x="620" y="288" text-anchor="middle" font-size="10" fill="#B91C1C">Privileged Raw Data Access</text>
  <text x="620" y="303" text-anchor="middle" font-size="10" font-weight="600" fill="#DC2626">⚠️ Restricted Privileged Role</text>

  <rect x="760" y="240" width="200" height="75" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="860" y="265" text-anchor="middle" font-size="11" font-weight="700" fill="#B45309">Audit Mandate Enforced</text>
  <text x="775" y="285" font-size="10" fill="#92400E">• Mandatory Justification Input</text>
  <text x="775" y="302" font-size="10" fill="#92400E">• UU PDP Pasal 47 Requirement</text>

  <line x1="395" y1="232" x2="515" y2="275" stroke="#EF4444" stroke-width="2" marker-end="url(#ar-red)"/>
  <text x="435" y="270" font-size="10" font-weight="700" fill="#DC2626">DPO</text>
  <line x1="720" y1="277" x2="755" y2="277" stroke="#D97706" stroke-width="2" marker-end="url(#ar-red)"/>

  <!-- Bottom Immutable Audit Trail -->
  <rect x="250" y="390" width="500" height="110" rx="8" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.5" filter="url(#f-shadow)"/>
  <text x="500" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#6B21A8">Immutable Audit Logger: audit_access_log</text>
  <text x="275" y="445" font-size="11" fill="#7E22CE">✓ Records Event ID, Timestamp, User ID &amp; Assigned Role</text>
  <text x="275" y="465" font-size="11" fill="#7E22CE">✓ Target Table, Requested Columns &amp; was_masked (0 or 1)</text>
  <text x="275" y="485" font-size="11" fill="#7E22CE">✓ Compliance Justification Reason (Full Evidence for External Audit)</text>

  <!-- Dashed logging arrows -->
  <path d="M 860 180 L 860 445 L 755 445" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#ar-green)"/>
  <path d="M 860 315 L 860 445 L 755 445" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#ar-red)"/>
</svg>
