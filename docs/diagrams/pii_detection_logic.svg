<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <filter id="drop" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A8A">DataShield-PDP: Indonesian PII Classification &amp; Masking Decision Flow</text>

  <!-- Start -->
  <rect x="390" y="70" width="220" height="50" rx="25" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5" filter="url(#drop)"/>
  <text x="500" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">Start: Column Text Samples</text>

  <!-- Decision 1 -->
  <polygon points="500,150 630,200 500,250 370,200" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" filter="url(#drop)"/>
  <text x="500" y="195" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">Is Numeric Dtype?</text>
  <text x="500" y="210" text-anchor="middle" font-size="10" fill="#B45309">(Amount, Score, Count)</text>

  <line x1="500" y1="120" x2="500" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Decision 1 Yes branch -->
  <line x1="630" y1="200" x2="740" y2="200" stroke="#10B981" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="680" y="190" font-size="11" font-weight="700" fill="#059669">YES</text>

  <rect x="745" y="170" width="190" height="60" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="840" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Tier: Public / Internal</text>
  <text x="840" y="215" text-anchor="middle" font-size="11" fill="#64748B">Strategy: None (Bypass)</text>

  <!-- Decision 2 -->
  <line x1="500" y1="250" x2="500" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="515" y="275" font-size="11" font-weight="700" fill="#475569">NO</text>

  <polygon points="500,290 640,345 500,400 360,345" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5" filter="url(#drop)"/>
  <text x="500" y="340" text-anchor="middle" font-size="11" font-weight="700" fill="#0369A1">Evaluate Patterns &amp;</text>
  <text x="500" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#0369A1">Presidio NLP Context</text>

  <!-- Branches -->
  <!-- Branch 1: NIK -->
  <rect x="40" y="440" width="200" height="110" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="140" y="465" text-anchor="middle" font-size="12" font-weight="700" fill="#991B1B">ID_NIK (Score: 1.00)</text>
  <text x="140" y="485" text-anchor="middle" font-size="10" fill="#DC2626">16 Digits + Prov Valid</text>
  <text x="140" y="510" text-anchor="middle" font-size="11" font-weight="700" fill="#7F1D1D">Tier: Restricted</text>
  <text x="140" y="530" text-anchor="middle" font-size="10" fill="#991B1B">Strategy: Partial_Mask</text>

  <!-- Branch 2: Phone -->
  <rect x="270" y="440" width="200" height="110" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="370" y="465" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">ID_PHONE (Score: 1.00)</text>
  <text x="370" y="485" text-anchor="middle" font-size="10" fill="#D97706">+62 / 08xx Mobile Prefix</text>
  <text x="370" y="510" text-anchor="middle" font-size="11" font-weight="700" fill="#78350F">Tier: Confidential</text>
  <text x="370" y="530" text-anchor="middle" font-size="10" fill="#B45309">Strategy: Partial_Mask</text>

  <!-- Branch 3: NLP Person/Email -->
  <rect x="500" y="440" width="210" height="110" rx="6" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.5"/>
  <text x="605" y="465" text-anchor="middle" font-size="12" font-weight="700" fill="#6B21A8">PERSON / EMAIL</text>
  <text x="605" y="485" text-anchor="middle" font-size="10" fill="#9333EA">Presidio Context Evaluation</text>
  <text x="605" y="510" text-anchor="middle" font-size="11" font-weight="700" fill="#581C87">Tier: Confidential</text>
  <text x="605" y="530" text-anchor="middle" font-size="10" fill="#7E22CE">Strategy: Redact / Domain</text>

  <!-- Branch 4: Salted Hash -->
  <rect x="740" y="440" width="220" height="110" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="850" y="465" text-anchor="middle" font-size="12" font-weight="700" fill="#065F46">CUSTOMER_IDENTIFIER</text>
  <text x="850" y="485" text-anchor="middle" font-size="10" fill="#059669">Primary / Foreign Key</text>
  <text x="850" y="510" text-anchor="middle" font-size="11" font-weight="700" fill="#064E3B">Tier: Restricted</text>
  <text x="850" y="530" text-anchor="middle" font-size="10" fill="#047857">Strategy: Salted_Hash</text>

  <!-- Connecting to branches -->
  <line x1="360" y1="345" x2="140" y2="345" stroke="#475569" stroke-width="1.5"/>
  <line x1="140" y1="345" x2="140" y2="435" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <line x1="420" y1="375" x2="370" y2="435" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="580" y1="375" x2="605" y2="435" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <line x1="640" y1="345" x2="850" y2="345" stroke="#475569" stroke-width="1.5"/>
  <line x1="850" y1="345" x2="850" y2="435" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Bottom Catalog Action -->
  <rect x="220" y="595" width="560" height="55" rx="8" fill="#1E3A8A" stroke="#172554" stroke-width="1.5" filter="url(#drop)"/>
  <text x="500" y="628" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Persist to pii_catalog &amp; Apply Transformations on Anonymized Mart</text>

  <line x1="140" y1="550" x2="220" y2="615" stroke="#475569" stroke-width="1.5"/>
  <line x1="370" y1="550" x2="400" y2="595" stroke="#475569" stroke-width="1.5"/>
  <line x1="605" y1="550" x2="600" y2="595" stroke="#475569" stroke-width="1.5"/>
  <line x1="850" y1="550" x2="780" y2="615" stroke="#475569" stroke-width="1.5"/>
</svg>
